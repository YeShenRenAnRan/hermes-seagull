name: seagull-armor-break
version: 1.0.0
description: "海鸥破甲插件 — 为 Hermes Agent 注入海鸥人格路由、技能触发映射与 seagull:* 技能包（逆向 / 渗透 / 漏洞利用 / 游戏安全 / 卡密验证链）。"
author: "YeShenRenAnRan"
license: MIT

# 由 register(ctx) 实际注册的 hook。必须是 Hermes 的 VALID_HOOKS 成员，
# 否则 hermes 会打印 "registered unknown hook" 警告且永不触发。
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - transform_llm_output
  - on_session_start
  - on_session_end
  - on_session_finalize

# 由 register(ctx) 通过 ctx.register_skill() 注册的技能（命名空间 seagull-armor-break）。
provides_skills:
  - seagull-reverse
  - seagull-pentest
  - seagull-exploit
  - seagull-game-hack
  - seagull-license-security
