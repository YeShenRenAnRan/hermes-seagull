name: 插件与发行版校验

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 校验插件 (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装 Hermes Agent（提供真实 hook 契约）
        run: |
          python -m pip install --upgrade pip
          python -m pip install hermes-agent

      - name: 自检（含真实 loader 试加载）
        run: python tools/verify_plugin.py

  # 旧版本这里是一个"每天凌晨 2 点合并上游"的定时任务：
  # 它把 NousResearch/hermes-agent（Hermes 本体）当 upstream 去 merge，
  # 两个仓库没有共同历史，merge 必然失败；随后又固定 push origin main，
  # 而本仓库默认分支是 master。
  # 已删除 —— 它唯一稳定的作用就是每天制造一次失败。
